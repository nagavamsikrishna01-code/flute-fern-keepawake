name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the command center
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://flute-fern-command-center.onrender.com/api/health" || true)
            echo "attempt $i -> HTTP $code"; [ "$code" = "200" ] && break; sleep 10
          done
      - name: Keep this schedule active (GitHub pauses schedules after 60 quiet days)
        uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now-last)/86400 )) -ge 45 ]; then
            git config user.name keepawake-bot; git config user.email keepawake@users.noreply.github.com
            date -u > .last-keepalive; git add .last-keepalive; git commit -m "keepalive"; git push
          fi
